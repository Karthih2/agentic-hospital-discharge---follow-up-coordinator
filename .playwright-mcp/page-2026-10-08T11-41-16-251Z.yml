          - listitem [ref=f7e247]:
            - generic [ref=f7e250]: Pending
        - paragraph [ref=f7e251]: Clean items go straight to Pending. Flagged items wait for a doctor, who can confirm them or correct them. A correction is checked by the gate again before it is accepted.
