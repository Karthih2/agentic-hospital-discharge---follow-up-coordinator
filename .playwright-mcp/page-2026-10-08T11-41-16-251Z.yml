    - generic [ref=f7e212]:
      - generic [ref=f7e213]:
        - heading "When the system is unsure, a person decides." [level=2] [ref=f7e215]
        - list [ref=f7e216]:
          - listitem [ref=f7e217]:
            - generic [ref=f7e219]: The gate is a set of fixed rules. It gives the same answer every time and can be explained.
          - listitem [ref=f7e220]:
            - generic [ref=f7e222]: It flags a missing or unclear date, dose, timing or doctor name, a symptom question, a medicine change, stop or clash, extraction confidence under 70%, and text that fits no category.
          - listitem [ref=f7e223]:
            - generic [ref=f7e225]: The system never resolves a flagged item. Only a doctor can close it.
          - listitem [ref=f7e226]:
            - generic [ref=f7e228]: Family members see "Waiting for doctor review" and nothing more.
      - generic [ref=f7e229]:
        - list [ref=f7e230]:
          - listitem [ref=f7e231]:
            - generic [ref=f7e234]: Item
