    - generic [ref=f6e147]:
      - heading "From a sheet of paper to a plan, in five steps." [level=2] [ref=f6e149]
      - list [ref=f6e150]:
        - listitem [ref=f6e152]:
          - generic [ref=f6e156]:
            - heading "1. Upload" [level=3] [ref=f6e157]
            - paragraph [ref=f6e158]: Paste the text or add a PDF or text file. Blank, scanned or non-medical input stops here with a clear message and a form to enter tasks by hand.
        - listitem [ref=f6e159]:
          - generic [ref=f6e163]:
            - heading "2. Extract" [level=3] [ref=f6e164]
            - paragraph [ref=f6e165]: A model reads the summary and returns the seven kinds of item, each with the exact line it came from and a confidence score.
        - listitem [ref=f6e166]:
          - generic [ref=f6e170]:
            - heading "3. Check" [level=3] [ref=f6e171]
            - paragraph [ref=f6e172]: Fixed rules decide what is clear. Anything missing, ambiguous or clinically sensitive is marked Needs Review.
        - listitem [ref=f6e173]:
          - generic [ref=f6e177]:
            - heading "4. Explain" [level=3] [ref=f6e178]
            - paragraph [ref=f6e179]: Care instructions and warnings are rewritten in plain language and translated. Medicines keep a fixed card and are never reworded.
        - listitem [ref=f6e180]:
          - generic [ref=f6e184]:
            - heading "5. Follow through" [level=3] [ref=f6e185]
            - paragraph [ref=f6e186]: Reminders go to you and, with your consent, to family. A missed task alerts the family member you chose.
    - heading "A model reads. Fixed rules decide. A doctor approves." [level=2] [ref=f6e188]:
