      - heading "From a sheet of paper to a plan, in five steps." [level=2] [ref=e152]
      - list [ref=e153]:
        - listitem [ref=e155]:
          - generic [ref=e159]:
            - heading "1. Upload" [level=3] [ref=e160]
            - paragraph [ref=e161]: Paste the text or add a PDF or text file. Blank, scanned or non-medical input stops here with a clear message and a form to enter tasks by hand.
        - listitem [ref=e162]:
          - generic [ref=e166]:
            - heading "2. Extract" [level=3] [ref=e167]
            - paragraph [ref=e168]: A model reads the summary and returns the seven kinds of item, each with the exact line it came from and a confidence score.
        - listitem [ref=e169]:
          - generic [ref=e173]:
            - heading "3. Check" [level=3] [ref=e174]
            - paragraph [ref=e175]: Fixed rules decide what is clear. Anything missing, ambiguous or clinically sensitive is marked Needs Review.
        - listitem [ref=e176]:
          - generic [ref=e180]:
            - heading "4. Explain" [level=3] [ref=e181]
            - paragraph [ref=e182]: Care instructions and warnings are rewritten in plain language and translated. Medicines keep a fixed card and are never reworded.
        - listitem [ref=e183]:
          - generic [ref=e187]:
            - heading "5. Follow through" [level=3] [ref=e188]
            - paragraph [ref=e189]: Reminders go to you and, with your consent, to family. A missed task alerts the family member you chose.
