    - generic [ref=f12e200]:
      - generic [ref=f12e201]:
        - heading "When the system is unsure, a person decides." [level=2] [ref=f12e203]
        - list [ref=f12e204]:
          - listitem [ref=f12e205]:
            - generic [ref=f12e207]: The gate is a set of fixed rules. It gives the same answer every time and can be explained.
          - listitem [ref=f12e208]:
            - generic [ref=f12e210]: It flags a missing or unclear date, dose, timing or doctor name, a symptom question, a medicine change, stop or clash, extraction confidence under 70%, and text that fits no category.
          - listitem [ref=f12e211]:
            - generic [ref=f12e213]: The system never resolves a flagged item. Only a doctor can close it.
          - listitem [ref=f12e214]:
            - generic [ref=f12e216]: Family members see "Waiting for doctor review" and nothing more.
