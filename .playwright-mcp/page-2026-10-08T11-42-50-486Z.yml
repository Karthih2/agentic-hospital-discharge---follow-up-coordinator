    - generic [ref=f9e159]:
      - heading "From a sheet of paper to a plan, in five steps." [level=2] [ref=f9e161]
      - list [ref=f9e162]:
        - listitem [ref=f9e164]:
          - generic [ref=f9e168]:
            - heading "1. Upload" [level=3] [ref=f9e169]
            - paragraph [ref=f9e170]: Paste the text or add a PDF or text file. Blank, scanned or non-medical input stops here with a clear message and a form to enter tasks by hand.
        - listitem [ref=f9e171]:
          - generic [ref=f9e175]:
            - heading "2. Extract" [level=3] [ref=f9e176]
            - paragraph [ref=f9e177]: A model reads the summary and returns the seven kinds of item, each with the exact line it came from and a confidence score.
        - listitem [ref=f9e178]:
          - generic [ref=f9e182]:
            - heading "3. Check" [level=3] [ref=f9e183]
            - paragraph [ref=f9e184]: Fixed rules decide what is clear. Anything missing, ambiguous or clinically sensitive is marked Needs Review.
        - listitem [ref=f9e185]:
          - generic [ref=f9e189]:
            - heading "4. Explain" [level=3] [ref=f9e190]
            - paragraph [ref=f9e191]: Care instructions and warnings are rewritten in plain language and translated. Medicines keep a fixed card and are never reworded.
        - listitem [ref=f9e192]:
          - generic [ref=f9e196]:
            - heading "5. Follow through" [level=3] [ref=f9e197]
            - paragraph [ref=f9e198]: Reminders go to you and, with your consent, to family. A missed task alerts the family member you chose.
    - heading "A model reads. Fixed rules decide. A doctor approves." [level=2] [ref=f9e200]:
      - paragraph [ref=f9e201]:
