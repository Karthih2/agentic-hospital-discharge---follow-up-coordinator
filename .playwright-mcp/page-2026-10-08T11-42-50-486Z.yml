    - generic [ref=f9e212]:
      - generic [ref=f9e213]:
        - heading "When the system is unsure, a person decides." [level=2] [ref=f9e215]
        - list [ref=f9e216]:
          - listitem [ref=f9e217]:
            - generic [ref=f9e219]: The gate is a set of fixed rules. It gives the same answer every time and can be explained.
          - listitem [ref=f9e220]:
            - generic [ref=f9e222]: It flags a missing or unclear date, dose, timing or doctor name, a symptom question, a medicine change, stop or clash, extraction confidence under 70%, and text that fits no category.
          - listitem [ref=f9e223]:
            - generic [ref=f9e225]: The system never resolves a flagged item. Only a doctor can close it.
          - listitem [ref=f9e226]:
            - generic [ref=f9e228]: Family members see "Waiting for doctor review" and nothing more.
      - generic [ref=f9e229]:
        - list [ref=f9e230]:
