    - generic [ref=f11e159]:
      - heading "From a sheet of paper to a plan, in five steps." [level=2] [ref=f11e161]
      - list [ref=f11e162]:
        - listitem [ref=f11e164]:
          - generic [ref=f11e168]:
            - heading "1. Upload" [level=3] [ref=f11e169]
            - paragraph [ref=f11e170]: Paste the text or add a PDF or text file. Blank, scanned or non-medical input stops here with a clear message and a form to enter tasks by hand.
        - listitem [ref=f11e171]:
          - generic [ref=f11e175]:
            - heading "2. Extract" [level=3] [ref=f11e176]
            - paragraph [ref=f11e177]: A model reads the summary and returns the seven kinds of item, each with the exact line it came from and a confidence score.
        - listitem [ref=f11e178]:
          - generic [ref=f11e182]:
            - heading "3. Check" [level=3] [ref=f11e183]
            - paragraph [ref=f11e184]: Fixed rules decide what is clear. Anything missing, ambiguous or clinically sensitive is marked Needs Review.
        - listitem [ref=f11e185]:
          - generic [ref=f11e189]:
            - heading "4. Explain" [level=3] [ref=f11e190]
            - paragraph [ref=f11e191]: Care instructions and warnings are rewritten in plain language and translated. Medicines keep a fixed card and are never reworded.
        - listitem [ref=f11e192]:
          - generic [ref=f11e196]:
            - heading "5. Follow through" [level=3] [ref=f11e197]
            - paragraph [ref=f11e198]: Reminders go to you and, with your consent, to family. A missed task alerts the family member you chose.
    - heading "A model reads. Fixed rules decide. A doctor approves." [level=2] [ref=f11e200]:
      - paragraph [ref=f11e201]:
        - generic [ref=f11e202]: A
        - generic [ref=f11e203]: model
