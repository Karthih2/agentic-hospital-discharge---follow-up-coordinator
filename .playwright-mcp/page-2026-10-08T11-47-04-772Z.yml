    - generic [ref=f11e212]:
      - generic [ref=f11e213]:
        - heading "When the system is unsure, a person decides." [level=2] [ref=f11e215]
        - list [ref=f11e216]:
          - listitem [ref=f11e217]:
            - generic [ref=f11e219]: The gate is a set of fixed rules. It gives the same answer every time and can be explained.
          - listitem [ref=f11e220]:
            - generic [ref=f11e222]: It flags a missing or unclear date, dose, timing or doctor name, a symptom question, a medicine change, stop or clash, extraction confidence under 70%, and text that fits no category.
          - listitem [ref=f11e223]:
            - generic [ref=f11e225]: The system never resolves a flagged item. Only a doctor can close it.
          - listitem [ref=f11e226]:
            - generic [ref=f11e228]: Family members see "Waiting for doctor review" and nothing more.
      - generic [ref=f11e229]:
        - list [ref=f11e230]:
