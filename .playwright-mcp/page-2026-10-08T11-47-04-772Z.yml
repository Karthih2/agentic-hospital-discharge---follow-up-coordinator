          - listitem [ref=f11e247]:
            - generic [ref=f11e250]: Pending
        - paragraph [ref=f11e251]: Clean items go straight to Pending. Flagged items wait for a doctor, who can confirm them or correct them. A correction is checked by the gate again before it is accepted.
