        - list [ref=f10e204]:
          - listitem [ref=f10e205]:
            - generic [ref=f10e207]: The gate is a set of fixed rules. It gives the same answer every time and can be explained.
          - listitem [ref=f10e208]:
            - generic [ref=f10e210]: It flags a missing or unclear date, dose, timing or doctor name, a symptom question, a medicine change, stop or clash, extraction confidence under 70%, and text that fits no category.
          - listitem [ref=f10e211]:
            - generic [ref=f10e213]: The system never resolves a flagged item. Only a doctor can close it.
          - listitem [ref=f10e214]:
            - generic [ref=f10e216]: Family members see "Waiting for doctor review" and nothing more.
