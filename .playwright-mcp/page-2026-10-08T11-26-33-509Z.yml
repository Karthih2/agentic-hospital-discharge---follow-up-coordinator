        - heading "When the system is unsure, a person decides." [level=2] [ref=f1e215]
        - list [ref=f1e216]:
          - listitem [ref=f1e217]:
            - generic [ref=f1e219]: The gate is a set of fixed rules. It gives the same answer every time and can be explained.
          - listitem [ref=f1e220]:
            - generic [ref=f1e222]: It flags a missing or unclear date, dose, timing or doctor name, a symptom question, a medicine change, stop or clash, extraction confidence under 70%, and text that fits no category.
          - listitem [ref=f1e223]:
            - generic [ref=f1e225]: The system never resolves a flagged item. Only a doctor can close it.
          - listitem [ref=f1e226]:
            - generic [ref=f1e228]: Family members see "Waiting for doctor review" and nothing more.
