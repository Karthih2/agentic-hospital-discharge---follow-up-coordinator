# One service: the API. The database is a SQLite file on the mounted ./data volume, so it survives restarts.
# Background jobs (reminders, missed-task alerts, review and plan aging) run inside the API process on a 60 second
# loop and take a lease in the database first; SQLite serializes writers, so a second API container is safe too.
services:
  api:
    build: .
    env_file: .env
    environment:
      SQLITE_PATH: /srv/data/discharge.db
    volumes:
      - ./data:/srv/data
    ports: ["8000:8000"]
    restart: unless-stopped
